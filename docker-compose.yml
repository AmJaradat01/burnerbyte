services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnerbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnerbyte}
      POSTGRES_DB: ${POSTGRES_DB:-burnerbyte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnerbyte}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-burnerbyte}:${POSTGRES_PASSWORD:-burnerbyte}@postgres:5432/${POSTGRES_DB:-burnerbyte}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      BB_MINIO_ENDPOINT: minio:9000
      BB_MINIO_ACCESS_KEY: minioadmin
      BB_MINIO_SECRET_KEY: minioadmin
      BB_MINIO_BUCKET: burnerbyte
      BB_MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  smtpd:
    build:
      context: .
      dockerfile: Dockerfile
      target: smtpd
    ports:
      - "2525:2525"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-burnerbyte}:${POSTGRES_PASSWORD:-burnerbyte}@postgres:5432/${POSTGRES_DB:-burnerbyte}?sslmode=disable
      REDIS_URL: redis://redis:6379
      BB_SMTP_LISTEN: ":2525"
      BB_SMTP_HOSTNAME: ${SMTP_HOSTNAME:-mail.burnerbyte.local}
      BB_MINIO_ENDPOINT: minio:9000
      BB_MINIO_ACCESS_KEY: minioadmin
      BB_MINIO_SECRET_KEY: minioadmin
      BB_MINIO_BUCKET: burnerbyte
      BB_MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:8080}/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
