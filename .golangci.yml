version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # Deferred close/rollback — errors are irrelevant after success path
        - (io.Closer).Close
        - (*net.Conn).Close
        - (net.Conn).Close
        - (*net.TCPListener).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/gorilla/websocket.Conn).WriteMessage
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*net/smtp.Client).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # HTTP response writes — caller can't recover
        - (net/http.ResponseWriter).Write
        - (io.Writer).Write
        - fmt.Fprintf
        - fmt.Fprint
        - (*encoding/json.Encoder).Encode
        # Viper env binding — never fails in practice
        - (*github.com/spf13/viper.Viper).BindEnv
        # crypto/rand.Read never returns error (Go 1.24+)
        - crypto/rand.Read
        # Fire-and-forget S3 cleanup — best-effort
        - (*github.com/minio/minio-go/v7.Client).RemoveObject
        # Fire-and-forget webhook logging — best-effort
        - (*github.com/amjaradat01/burnerbyte/internal/repository/postgres.WebhookRepo).LogDelivery
        - (*github.com/amjaradat01/burnerbyte/internal/repository/postgres.WebhookRepo).UpdateDeliveryStatus
