# BurnerByte Default Configuration
# Values here are system defaults. Override via environment variables or .env file.

server:
  port: 8080
  base_url: http://localhost:8080
  frontend_url: http://localhost:3000
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_body_size: 1048576  # 1 MB

database:
  url: postgres://postgres:password@localhost:5432/burnerbyte?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  url: redis://localhost:6379/0
  max_retries: 3

minio:
  # Leave endpoint empty to store attachments on the local filesystem
  # (./data/attachments). localhost:9000 is what `make docker-infra` starts; an
  # endpoint that is set but unreachable costs a dial timeout on every boot
  # before falling back, so clear it rather than leaving a stale value.
  endpoint: localhost:9000
  access_key: "CHANGE_ME"
  secret_key: "CHANGE_ME"
  bucket: burnerbyte
  use_ssl: false

jwt:
  secret: "CHANGE_ME_TO_RANDOM_64_CHARS"
  access_ttl: 15m
  refresh_ttl: 168h

# httpOnly refresh-token cookie for browser clients (web UI).
# same_site: lax (default) | strict | none — use "none" only when the frontend
# and API are served from unrelated domains; it forces Secure (HTTPS required).
auth_cookie:
  same_site: lax

smtp:
  listen: 0.0.0.0:2525
  hostname: mail.example.com
  max_size: 26214400
  queue_size: 1000
  workers: 4
  # Set both to enable STARTTLS on the inbound listener.
  tls_cert: ""
  tls_key: ""

mailer:
  host: ""
  port: 587
  username: ""
  password: "CHANGE_ME"
  from: noreply@example.com
  tls: true

sso:
  provider: ""
  client_id: ""
  client_secret: "CHANGE_ME"
  redirect_url: http://localhost:8080/api/v1/auth/sso/callback
  tenant_id: ""          # azure
  issuer_url: ""         # okta / generic oidc discovery
  auto_provision: false  # give first-time SSO users an org (and team) membership
  default_org_role: ""
  default_team_role: ""
  allowed_domains: ""    # comma-separated; empty allows any

cors:
  allowed_origins:
    - http://localhost:3000
    - http://10.10.1.50:3000
  allowed_methods:
    - GET
    - POST
    - PATCH
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
  max_age: 86400

rate_limit:
  enabled: true
  authenticated: 300    # requests per minute per user
  unauthenticated: 60   # requests per minute per IP
  login: 10             # attempts per minute per IP
  forgot_password: 3    # requests per hour per IP
  # CIDRs whose X-Forwarded-For is trusted when resolving the client IP.
  trusted_proxies: []

lockout:
  max_attempts: 5
  duration: 15m

password_policy:
  min_length: 8
  require_uppercase: true
  require_lowercase: true
  require_number: true
  require_special: true
  bcrypt_cost: 10       # bcrypt.DefaultCost; out-of-range falls back to it

defaults:
  attachments_enabled: true
  allow_registration: true
  default_inbox_ttl: 10m
  max_inbox_ttl: 24h
  max_attachment_size_mb: 25
  max_domains: 10
  max_teams: 50
  max_inboxes_per_domain: 100
  enforce_sso: false
  max_sessions_per_user: 5
  password_reset_ttl: 1h
  invite_expiry_ttl: 48h
  presigned_url_ttl: 15m
  webhook_timeout: 10s
  analytics_cache_ttl: 2h
  webhook_max_retries: 3
  analytics_default_days: 30
  timezone: UTC
  date_format: YYYY-MM-DD
  time_format: 24h

email_verification:
  enabled: true
  ttl: 24h

logging:
  level: info
  format: json

metrics:
  enabled: true
  path: /metrics
  # When set, /metrics also requires "Authorization: Bearer <token>" on top of
  # the loopback/private-address check, which otherwise depends on the proxy
  # overwriting inbound X-Forwarded-For and X-Real-IP.
  token: ""

security:
  # Re-enables "?token=<jwt>" on the WebSocket endpoints; the browser client
  # uses the one-time ?ticket= flow instead.
  allow_token_query_param: false
  # Refuse password logins until the email address is confirmed.
  require_email_verification: false

workers:
  dns_recheck_interval: 1h
  cleanup_interval: 5m
  webhook_retry_interval: 1m
  reconciler_interval: 1m
  analytics_interval: 5m

# Encryption at rest for sensitive DB values (SSO client secrets, SMTP passwords,
# object-storage credentials). Strongly recommended. Env var: ENCRYPTION_KEY.
# Generate with: openssl rand -hex 32
encryption:
  # 64-char hex string (32 bytes) for AES-256-GCM. If left empty, the values
  # above are stored UNENCRYPTED (plaintext) in the database, not just "disabled".
  key: ""

# Public "try it" demo inbox on the landing page. Off by default. When enabled,
# logged-out visitors can create a real, short-lived disposable inbox and watch
# real mail arrive (POST /api/v1/try/inbox, rate-limited; receive-only). It is
# IDOR-safe: the read endpoint is scoped to the demo user, so only demo inboxes
# are ever readable. Provision a dedicated org/team/user and assign a domain to
# that team, then set the assignment + user IDs below.
demo:
  enabled: false           # DEMO_ENABLED
  assignment_id: ""        # DEMO_ASSIGNMENT_ID — a domain assignment the demo user's team owns
  user_id: ""              # DEMO_USER_ID — the demo account that owns created inboxes
  ttl: 10m                 # DEMO_TTL — how long each demo inbox lives
