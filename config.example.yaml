# BurnerByte Default Configuration
# Values here are system defaults. Override via environment variables or .env file.

server:
  port: 8080
  base_url: http://localhost:8080
  frontend_url: http://localhost:3000
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_body_size: 1048576  # 1 MB

database:
  url: postgres://postgres:password@localhost:5432/burnerbyte?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  url: redis://localhost:6379/0
  max_retries: 3

minio:
  endpoint: localhost:9000
  access_key: "CHANGE_ME"
  secret_key: "CHANGE_ME"
  bucket: burnerbyte
  use_ssl: false

jwt:
  secret: "CHANGE_ME_TO_RANDOM_64_CHARS"
  access_ttl: 15m
  refresh_ttl: 168h

smtp:
  listen: 0.0.0.0:2525
  hostname: mail.example.com
  max_size: 26214400
  queue_size: 1000
  workers: 4

mailer:
  host: ""
  port: 587
  username: ""
  password: "CHANGE_ME"
  from: noreply@example.com
  tls: true

sso:
  provider: ""
  client_id: ""
  client_secret: "CHANGE_ME"
  redirect_url: http://localhost:8080/api/v1/auth/sso/callback

cors:
  allowed_origins:
    - http://localhost:3000
    - http://10.10.1.50:3000
  allowed_methods:
    - GET
    - POST
    - PATCH
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
  max_age: 86400

rate_limit:
  enabled: true
  authenticated: 300    # requests per minute per user
  unauthenticated: 60   # requests per minute per IP
  login: 10             # attempts per minute per IP
  forgot_password: 3

lockout:
  max_attempts: 5
  duration: 15m

password_policy:
  min_length: 8
  require_uppercase: true
  require_lowercase: true
  require_number: true
  require_special: true

defaults:
  attachments_enabled: true
  allow_registration: true
  default_inbox_ttl: 10m
  max_inbox_ttl: 24h
  max_attachment_size_mb: 25
  max_domains: 10
  max_teams: 50
  max_inboxes_per_domain: 100
  enforce_sso: false
  max_sessions_per_user: 5
  password_reset_ttl: 1h
  invite_expiry_ttl: 48h
  presigned_url_ttl: 15m
  webhook_timeout: 10s
  analytics_cache_ttl: 2h

email_verification:
  enabled: true

logging:
  level: info
  format: json

metrics:
  enabled: true
  path: /metrics

workers:
  dns_recheck_interval: 1h
  cleanup_interval: 5m
  webhook_retry_interval: 1m
  reconciler_interval: 1m
  analytics_interval: 5m

# Encryption at rest for sensitive DB values (SSO secrets, SMTP passwords)
# Generate with: openssl rand -hex 32
encryption:
  key: "" # Leave empty to disable, or set 64-char hex string for AES-256-GCM
