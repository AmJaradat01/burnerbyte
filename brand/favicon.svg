<!-- The B alone, for sizes where a wordmark cannot survive: favicon, PWA icon,
     browser tab. Mirrors the product's own behaviour — the sidebar shows the
     full wordmark expanded and collapses to a bare B. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BurnerByte">
  <rect width="512" height="512" rx="112" fill="#2459E2"/>
  <text x="256" y="356" text-anchor="middle"
        font-family="Geist, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="300" font-weight="800" letter-spacing="-12" fill="#FFFFFF">B</text>
</svg>
