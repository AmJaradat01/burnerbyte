# The gates a contributor's pull request must pass. Verification only — it
# deploys nothing and needs no secrets, so it runs on forks too.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets the suite be re-run from the Actions tab without an empty commit.
  workflow_dispatch:
  # A dependency can become vulnerable with no commit to trigger on.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    services:
      # The repository suite includes integration tests that need a real
      # database; without one they skip, which would hide regressions.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: burnerbyte_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/burnerbyte_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin migrate
          migrate -version

      # Applied before the tests: the repository suite compares
      # schema_migrations against migrations/ and fails if the schema is behind.
      - name: Apply migrations
        run: migrate -database "$TEST_DATABASE_URL" -path migrations up

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The pnpm project lives in web/, not the repository root, so the action
      # has to be told where "packageManager" is — it looks at the root by
      # default and fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Not redundant with the build: next build only typechecks files in its
      # build graph, so errors confined to *.test.tsx pass both lint and build.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves a clean checkout still produces all three images — the failure
      # mode that made the stack unusable before v1.12.0.
      - run: docker compose build

  # Dependencies were the one surface left that could rot silently between
  # releases: the config, the OpenAPI spec and the docs all have drift guards
  # in the test suite, but a CVE published against a pinned version shows up
  # nowhere until someone thinks to look. A security audit found 18 reachable
  # Go advisories and two unauthenticated RCEs in the frontend tree that way.
  #
  # Runs on a schedule as well as on push, because a dependency can become
  # vulnerable without anyone touching the repository.
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Reports only advisories this code can actually reach, so the result
      # is a list to act on rather than noise from the module graph.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      # --prod because a dev-only advisory does not reach a deployed instance,
      # and mixing the two buries the ones that do. The threshold is "high":
      # moderates are reported without failing the build.
      #
      # Known exception: image-size, pulled in by fumadocs to measure images
      # while building the docs, carries two high advisories with no patched
      # release upstream. Its parser only ever sees images committed to this
      # repository, so there is no untrusted input on that path.
      - name: pnpm audit
        working-directory: web
        run: |
          pnpm audit --prod --audit-level moderate || true
          pnpm audit --prod --audit-level high --json > audit.json || true
          python3 - <<'EOF'
          import json, sys
          with open("audit.json") as f:
              data = json.load(f)
          allowed = {"image-size"}
          blocking = [
              a for a in data.get("advisories", {}).values()
              if a.get("severity") in ("high", "critical") and a.get("module_name") not in allowed
          ]
          for a in blocking:
              print(f"{a['severity']}: {a['module_name']} — {a['title']} (fix {a['patched_versions']})")
          if blocking:
              print(f"\n{len(blocking)} high or critical advisories in the production tree.")
              sys.exit(1)
          print("No unexpected high or critical advisories in the production tree.")
          EOF
