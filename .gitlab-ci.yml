stages:
  - lint
  - build
  - test
  - deploy

variables:
  GOPATH: ${CI_PROJECT_DIR}/.go
  GOFLAGS: "-mod=readonly"
  POSTGRES_USER: burnerbyte
  POSTGRES_PASSWORD: burnerbyte
  POSTGRES_DB: burnerbyte_test

# ── Lint ──

lint:go:
  stage: lint
  image: golangci/golangci-lint:v1.62-alpine
  script:
    - golangci-lint run ./...
  cache:
    key: go-lint
    paths:
      - .go/pkg/mod

lint:frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - corepack enable
    - cd web && pnpm install --frozen-lockfile
  script:
    - pnpm lint
  cache:
    key: pnpm
    paths:
      - web/node_modules

# ── Build ──

build:go:
  stage: build
  image: golang:1.22-alpine
  before_script:
    - apk add --no-cache git
  script:
    - go mod download
    - CGO_ENABLED=0 go build -o bin/api ./cmd/api
    - CGO_ENABLED=0 go build -o bin/smtpd ./cmd/smtpd
  artifacts:
    paths:
      - bin/
    expire_in: 1 hour
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod

build:frontend:
  stage: build
  image: node:20-alpine
  before_script:
    - corepack enable
    - cd web && pnpm install --frozen-lockfile
  script:
    - cd web && pnpm build
  cache:
    key: pnpm
    paths:
      - web/node_modules

build:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --target api -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA .
    - docker build --target smtpd -t $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_SHORT_SHA .
    - docker build -f Dockerfile.frontend -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ── Test ──

test:go:
  stage: test
  image: golang:1.22-alpine
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - apk add --no-cache git
  script:
    - go test -race -coverprofile=coverage.out ./...
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod

test:migrations:
  stage: test
  image: migrate/migrate:v4.17.0
  services:
    - postgres:16-alpine
  variables:
    DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
  script:
    - migrate -database "$DATABASE_URL" -path migrations up
    - migrate -database "$DATABASE_URL" -path migrations down -all

# ── Deploy ──

deploy:tag:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
    - docker pull $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_SHORT_SHA
    - docker pull $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG
    - docker tag $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/api:latest
    - docker tag $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_TAG
    - docker tag $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/smtpd:latest
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE/api:latest
    - docker push $CI_REGISTRY_IMAGE/smtpd:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE/smtpd:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - if: $CI_COMMIT_TAG
